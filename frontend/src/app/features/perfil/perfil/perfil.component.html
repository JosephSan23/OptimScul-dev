<div class="perfil" *ngIf="!cargando">
  <div class="aviso-obligatorio" *ngIf="obligatorio">
    Completa tu perfil para continuar. Faltan datos obligatorios.
  </div>

  <div class="tabs">
    <button [class.activo]="tab === 'datos'" (click)="tab = 'datos'">
      Mis datos
    </button>
    <button [class.activo]="tab === 'password'" (click)="tab = 'password'">
      Contraseña
    </button>
    <button [class.activo]="tab === 'foto'" (click)="tab = 'foto'">Foto</button>
  </div>

  <p class="error" *ngIf="error">{{ error }}</p>
  <p class="exito" *ngIf="exito">{{ exito }}</p>

  <!-- DATOS -->
  <form *ngIf="tab === 'datos'" (ngSubmit)="guardarDatos()" class="form">
    <fieldset disabled class="bloque">
      <legend>Identidad (la gestiona la institución)</legend>
      <input [value]="p.tipoDocumento + ' ' + p.numeroDocumento" />
      <input [value]="p.primerNombre + ' ' + p.primerApellido" />
    </fieldset>

    <label
      >Segundo nombre
      <input [class.is-invalid]="erroresDatos['segundoNombre']" [(ngModel)]="p.segundoNombre" name="sn" (blur)="validarDato('segundoNombre')" />
      <small class="campo-error" *ngIf="erroresDatos['segundoNombre']"><i class="ti ti-alert-circle"></i> {{ erroresDatos['segundoNombre'] }}</small>
    </label>
    <label
      >Segundo apellido
      <input [class.is-invalid]="erroresDatos['segundoApellido']" [(ngModel)]="p.segundoApellido" name="sa" (blur)="validarDato('segundoApellido')" />
      <small class="campo-error" *ngIf="erroresDatos['segundoApellido']"><i class="ti ti-alert-circle"></i> {{ erroresDatos['segundoApellido'] }}</small>
    </label>
    <label [class.falta]="falta('fechaNacimiento')"
      >Fecha de nacimiento *
      <input type="date" [class.is-invalid]="erroresDatos['fechaNacimiento']" [(ngModel)]="p.fechaNacimiento" name="fn" (blur)="validarDato('fechaNacimiento')" />
      <small class="campo-error" *ngIf="erroresDatos['fechaNacimiento']"><i class="ti ti-alert-circle"></i> {{ erroresDatos['fechaNacimiento'] }}</small>
    </label>
    <label [class.falta]="falta('sexo')"
      >Sexo *
      <select [class.is-invalid]="erroresDatos['sexo']" [(ngModel)]="p.sexo" name="sx" (change)="validarDato('sexo')">
        <option value="">—</option>
        <option *ngFor="let s of sexos" [value]="s">{{ s }}</option>
      </select>
      <small class="campo-error" *ngIf="erroresDatos['sexo']"><i class="ti ti-alert-circle"></i> {{ erroresDatos['sexo'] }}</small>
    </label>
    <label
      >Nacionalidad <input [(ngModel)]="p.nacionalidad" name="nac"
    /></label>
    <label [class.falta]="falta('telefono')"
      >Teléfono *
      <input [class.is-invalid]="erroresDatos['telefono']" [(ngModel)]="p.telefono" name="tel" (blur)="validarDato('telefono')" />
      <small class="campo-error" *ngIf="erroresDatos['telefono']"><i class="ti ti-alert-circle"></i> {{ erroresDatos['telefono'] }}</small>
    </label>
    <label
      >Teléfono alternativo
      <input [class.is-invalid]="erroresDatos['telefonoAlternativo']" [(ngModel)]="p.telefonoAlternativo" name="tel2" (blur)="validarDato('telefonoAlternativo')" />
      <small class="campo-error" *ngIf="erroresDatos['telefonoAlternativo']"><i class="ti ti-alert-circle"></i> {{ erroresDatos['telefonoAlternativo'] }}</small>
    </label>
    <label
      >Correo
      <input [class.is-invalid]="erroresDatos['correo']" [(ngModel)]="p.correo" name="cor" (blur)="validarDato('correo')" />
      <small class="campo-error" *ngIf="erroresDatos['correo']"><i class="ti ti-alert-circle"></i> {{ erroresDatos['correo'] }}</small>
    </label>
    <label [class.falta]="falta('direccion')"
      >Dirección *
      <input [class.is-invalid]="erroresDatos['direccion']" [(ngModel)]="p.direccion" name="dir" (blur)="validarDato('direccion')" />
      <small class="campo-error" *ngIf="erroresDatos['direccion']"><i class="ti ti-alert-circle"></i> {{ erroresDatos['direccion'] }}</small>
    </label>
    <label>Barrio <input [(ngModel)]="p.barrio" name="bar" /></label>
    <label [class.falta]="falta('ciudad')"
      >Ciudad *
      <input [class.is-invalid]="erroresDatos['ciudad']" [(ngModel)]="p.ciudad" name="ciu" (blur)="validarDato('ciudad')" />
      <small class="campo-error" *ngIf="erroresDatos['ciudad']"><i class="ti ti-alert-circle"></i> {{ erroresDatos['ciudad'] }}</small>
    </label>
    <label
      >Departamento <input [(ngModel)]="p.departamento" name="dep"
    /></label>
    <label>País <input [(ngModel)]="p.pais" name="pai" /></label>

    <ng-container *ngIf="p.esDocente">
      <label
        >Especialidad <input [(ngModel)]="p.especialidad" name="esp"
      /></label>
      <label
        >Título profesional <input [(ngModel)]="p.tituloProfesional" name="tit"
      /></label>
    </ng-container>

    <button type="submit" [disabled]="guardando">Guardar datos</button>
  </form>

  <!-- CONTRASEÑA -->
  <form *ngIf="tab === 'password'" (ngSubmit)="cambiarPassword()" class="form">
    <label
      >Contraseña actual
      <input type="password" [class.is-invalid]="erroresPass['actual']" [(ngModel)]="pass.actual" name="pa" (blur)="validarPass('actual')" />
      <small class="campo-error" *ngIf="erroresPass['actual']"><i class="ti ti-alert-circle"></i> {{ erroresPass['actual'] }}</small>
    </label>
    <label
      >Nueva contraseña
      <input type="password" [class.is-invalid]="erroresPass['nueva']" [(ngModel)]="pass.nueva" name="pn" (blur)="validarPass('nueva')" />
      <small class="campo-error" *ngIf="erroresPass['nueva']"><i class="ti ti-alert-circle"></i> {{ erroresPass['nueva'] }}</small>
    </label>
    <label
      >Confirmar
      <input type="password" [class.is-invalid]="erroresPass['confirmar']" [(ngModel)]="pass.confirmar" name="pc" (blur)="validarPass('confirmar')" />
      <small class="campo-error" *ngIf="erroresPass['confirmar']"><i class="ti ti-alert-circle"></i> {{ erroresPass['confirmar'] }}</small>
    </label>
    <button type="submit" [disabled]="guardando">Cambiar contraseña</button>
  </form>

  <!-- FOTO -->
  <div *ngIf="tab === 'foto'" class="form">
    <img *ngIf="p.fotoUrl" [src]="p.fotoUrl" alt="Foto" class="avatar-foto" />
    <input
      type="file"
      accept="image/png,image/jpeg,image/webp"
      (change)="onFoto($event)"
    />
  </div>
</div>
