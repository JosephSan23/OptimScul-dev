<div class="modal-overlay">
  <div class="modal-card">
    <button class="cerrar" *ngIf="!obligatorio" (click)="onCerrar()">
      <i class="ti ti-x"></i>
    </button>
    <div class="modal-icono"><i class="ti ti-lock"></i></div>
    <h2>Cambia tu contraseña</h2>
    <p class="modal-sub">
      Por seguridad, crea una contraseña nueva antes de continuar.
    </p>

    <label
      >Contraseña actual
      <input
        type="password"
        [(ngModel)]="pass.actual"
        name="pa"
        autocomplete="current-password"
    /></label>
    <label
      >Nueva contraseña
      <div class="input-pass">
        <input
          [type]="verNueva ? 'text' : 'password'"
          [(ngModel)]="pass.nueva"
          name="pn"
          autocomplete="new-password"
        />
        <i
          class="ti"
          [class.ti-eye]="!verNueva"
          [class.ti-eye-off]="verNueva"
          (click)="verNueva = !verNueva"
        ></i></div
    ></label>
    <label
      >Confirmar
      <input
        type="password"
        [(ngModel)]="pass.confirmar"
        name="pc"
        autocomplete="new-password"
    /></label>

    <ul class="requisitos">
      <li [class.ok]="reglas.longitud">
        <i
          class="ti"
          [class.ti-check]="reglas.longitud"
          [class.ti-point]="!reglas.longitud"
        ></i>
        Mínimo 8 caracteres
      </li>
      <li [class.ok]="reglas.mayuscula">
        <i
          class="ti"
          [class.ti-check]="reglas.mayuscula"
          [class.ti-point]="!reglas.mayuscula"
        ></i>
        Al menos una mayúscula
      </li>
      <li [class.ok]="reglas.numero">
        <i
          class="ti"
          [class.ti-check]="reglas.numero"
          [class.ti-point]="!reglas.numero"
        ></i>
        Al menos un número
      </li>
      <li [class.ok]="reglas.coincide">
        <i
          class="ti"
          [class.ti-check]="reglas.coincide"
          [class.ti-point]="!reglas.coincide"
        ></i>
        Las contraseñas coinciden
      </li>
    </ul>

    <p class="error" *ngIf="error">{{ error }}</p>
    <button
      class="btn-guardar"
      [disabled]="!valida || guardando"
      (click)="guardar()"
    >
      {{ guardando ? "Guardando…" : "Guardar y continuar" }}
    </button>
  </div>
</div>
