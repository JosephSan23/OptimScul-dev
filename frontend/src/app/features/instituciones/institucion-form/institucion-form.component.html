<div class="form-grid">
  <div>
    <label>Código *</label>
    <input [class.is-invalid]="errores['codigo']"
           [(ngModel)]="form.codigo" [ngModelOptions]="{standalone: true}" placeholder="COL-001"
           (blur)="validar('codigo')">
    <small class="campo-error" *ngIf="errores['codigo']"><i class="ti ti-alert-circle"></i> {{ errores['codigo'] }}</small>
  </div>
  <div>
    <label>Nombre *</label>
    <input [class.is-invalid]="errores['nombre']"
           [(ngModel)]="form.nombre" [ngModelOptions]="{standalone: true}" placeholder="Nombre"
           (blur)="validar('nombre')">
    <small class="campo-error" *ngIf="errores['nombre']"><i class="ti ti-alert-circle"></i> {{ errores['nombre'] }}</small>
  </div>
  <div>
    <label>Tipo *</label>
    <select [class.is-invalid]="errores['tipoInstitucion']"
            [(ngModel)]="form.tipoInstitucion" [ngModelOptions]="{standalone: true}"
            (change)="validar('tipoInstitucion')">
      <option *ngFor="let t of tipos" [value]="t">{{ etiquetaTipo(t) }}</option>
    </select>
    <small class="campo-error" *ngIf="errores['tipoInstitucion']"><i class="ti ti-alert-circle"></i> {{ errores['tipoInstitucion'] }}</small>
  </div>
  <div>
    <label>NIT</label>
    <input [(ngModel)]="form.nit" [ngModelOptions]="{standalone: true}">
  </div>
  <div>
    <label>Ciudad</label>
    <input [(ngModel)]="form.ciudad" [ngModelOptions]="{standalone: true}">
  </div>
  <div>
    <label>Departamento</label>
    <input [(ngModel)]="form.departamento" [ngModelOptions]="{standalone: true}">
  </div>
  <div>
    <label>Correo de contacto</label>
    <input [class.is-invalid]="errores['correoContacto']"
           [(ngModel)]="form.correoContacto" [ngModelOptions]="{standalone: true}"
           (blur)="validar('correoContacto')">
    <small class="campo-error" *ngIf="errores['correoContacto']"><i class="ti ti-alert-circle"></i> {{ errores['correoContacto'] }}</small>
  </div>
  <div>
    <label>Dominio de correo</label>
    <input [(ngModel)]="form.dominioCorreo" [ngModelOptions]="{standalone: true}"
           placeholder="colegiosanjose.edu.co">
  </div>
  <div>
    <label>Teléfono</label>
    <input [class.is-invalid]="errores['telefonoContacto']"
           [(ngModel)]="form.telefonoContacto" [ngModelOptions]="{standalone: true}"
           (blur)="validar('telefonoContacto')">
    <small class="campo-error" *ngIf="errores['telefonoContacto']"><i class="ti ti-alert-circle"></i> {{ errores['telefonoContacto'] }}</small>
  </div>
  <div class="form-full">
    <label>Dirección principal</label>
    <input [(ngModel)]="form.direccionPrincipal" [ngModelOptions]="{standalone: true}">
  </div>

  <div class="form-error" *ngIf="errorForm">{{ errorForm }}</div>

  <div class="form-actions">
    <button type="button" class="btn-cancel" (click)="cancelar()">Cancelar</button>
    <button type="button" class="btn-save" [disabled]="guardando" (click)="guardar()">
      {{ guardando ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>
</div>
