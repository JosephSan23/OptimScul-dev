spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/optimscul
    username: optimscul
    password: optimscul1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    schemas: optimscul
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    # El correo Gmail DESDE el que se envían los mensajes:
    username: optimscul@gmail.com
    # La "Contraseña de aplicación" de 16 caracteres de Google (NO tu clave normal).
    # Opción rápida: reemplaza el texto REEMPLAZA_CON_TU_APP_PASSWORD por tu clave.
    # Opción segura: deja esto igual y define la variable de entorno MAIL_PASSWORD.
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# ── Notificaciones por correo (nivel raíz: así SÍ lo lee @Value) ──
notificaciones:
  email:
    habilitado: true
    remitente: "OptimScul <optimscul@gmail.com>"

logging:
  level:
    com.optimscul: DEBUG
    org.flywaydb: INFO

jwt:
  secret: dev-secret-clave-local-no-importa-seguridad-aqui-1234
  expiration-ms: 86400000

storage:
  endpoint: http://localhost:9000
  region: us-east-1
  access-key: optimscul
  secret-key: optimscul1234
  bucket: optimscul
  path-style-access: true
  url-expiration-minutes: 15
  upload:
    max-archivos-por-entrega: 5
    max-tamano-mb: 25
