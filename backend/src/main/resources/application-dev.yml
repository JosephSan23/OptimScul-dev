spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/optimscul
    username: optimscul
    password: optimscul1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    schemas: optimscul
    locations: classpath:db/migration
  
  mail:
    host: smtp.tu-proveedor.com
    port: 587
    username: TU_USUARIO
    password: TU_PASSWORD
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  notificaciones:
  email:
    habilitado: false
    remitente: "OptimScul <no-reply@optimscul.com>"

logging:
  level:
    com.optimscul: DEBUG
    org.flywaydb: INFO

jwt:
  secret: dev-secret-clave-local-no-importa-seguridad-aqui-1234
  expiration-ms: 86400000

storage:
  endpoint: http://localhost:9000
  region: us-east-1
  access-key: optimscul
  secret-key: optimscul1234
  bucket: optimscul
  path-style-access: true
  url-expiration-minutes: 15
  upload:
    max-archivos-por-entrega: 5
    max-tamano-mb: 25